<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- will-ia · ícone do app: squircle azul com onda de voz em 5 barras (marca da fala/assistente) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1B4A" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- fundo: squircle com margem (padrão macOS ≈ 10%) -->
  <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="6"/>
  <!-- onda de voz: 5 barras arredondadas -->
  <g fill="url(#bar)" filter="url(#shadow)">
    <rect x="266" y="432" width="76" height="160" rx="38"/>
    <rect x="376" y="352" width="76" height="320" rx="38"/>
    <rect x="486" y="272" width="76" height="480" rx="38"/>
    <rect x="596" y="352" width="76" height="320" rx="38"/>
    <rect x="706" y="432" width="76" height="160" rx="38"/>
  </g>
</svg>
