[package]
name = "will-core"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
secrecy.workspace = true
async-trait.workspace = true
schemars.workspace = true
parking_lot.workspace = true
directories.workspace = true

# No navegador (app web, `docs/33`) o tokio entra só com o que compila em
# WASM: canais e temporizadores, sem rede nem processos.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.54", default-features = false, features = ["sync", "time", "macros", "rt"] }
uuid = { version = "1", features = ["v4", "v7", "serde", "js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

[lints]
workspace = true
