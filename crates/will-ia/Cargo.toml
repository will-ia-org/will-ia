[package]
name = "will-ia"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "will-ia — servidor residente: Claude Code (cérebro) + Telegram + MCP + voz + agendamentos; bandeja quando há desktop"

[[bin]]
name = "will-ia"
path = "src/main.rs"

[features]
default = ["telegram", "google", "whatsapp", "whatsapp-real"]
telegram = ["will-server/telegram"]
google = ["will-server/google"]
whatsapp = ["will-server/whatsapp"]
whatsapp-real = ["will-server/whatsapp-real"]

[dependencies]
chrono.workspace = true
will-core.workspace = true
will-storage.workspace = true
serde_json.workspace = true
secrecy.workspace = true
will-server.workspace = true
will-platform.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
clap.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon.workspace = true

[package.metadata.deb]
name = "will-ia"
maintainer = "will-ia-org <noreply@github.com>"
extended-description = "Assistente pessoal: servidor will-ia (Claude Code + voz + Telegram + MCP) e app desktop will-ia-app."
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/will-ia", "usr/bin/", "755"],
  ["target/release/will-ia-app", "usr/bin/", "755"],
  ["target/release/will-ia-setup", "usr/bin/", "755"],
  ["../../packaging/linux/will-ia.desktop", "usr/share/applications/", "644"],
  ["../../packaging/systemd/will-ia.service", "usr/lib/systemd/user/", "644"],
  ["../../README.md", "usr/share/doc/will-ia/", "644"],
  ["../../assets/icon/will-ia-48.png", "usr/share/icons/hicolor/48x48/apps/will-ia.png", "644"],
  ["../../assets/icon/will-ia-128.png", "usr/share/icons/hicolor/128x128/apps/will-ia.png", "644"],
  ["../../assets/icon/will-ia-256.png", "usr/share/icons/hicolor/256x256/apps/will-ia.png", "644"],
  ["../../assets/icon/will-ia-512.png", "usr/share/icons/hicolor/512x512/apps/will-ia.png", "644"],
]

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
