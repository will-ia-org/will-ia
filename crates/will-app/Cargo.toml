[package]
name = "will-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "will-ia-app — app desktop (egui): cliente do servidor will-ia (HTTP/WS), voz e configurações"

[[bin]]
name = "will-ia-app"
path = "src/main.rs"

[dependencies]
will-core.workspace = true
will-client.workspace = true
will-platform.workspace = true
tokio.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
chrono.workspace = true
bytes.workspace = true
parking_lot.workspace = true
clap.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui_commonmark.workspace = true
# Ícones Material Symbols (fonte embutida, ~1,8 MB) — ver src/icons.rs.
egui_material_icons = "0.9"
# emoji-icon-font do egui (🗐 ✔ ↺ ⟳ …): o egui 0.37 só a carrega com `monochrome_emoji_fonts`;
# o botão "copiar" do egui_commonmark usa 🗐.
epaint_default_fonts = { version = "0.37", features = ["monochrome_emoji_fonts"] }
cpal.workspace = true
rfd.workspace = true
global-hotkey.workspace = true
auto-launch = "0.5"
qrcode.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[dev-dependencies]
ab_glyph = "0.2"

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
