[package]
name = "will-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
will-core.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
directories.workspace = true
open.workspace = true
png = "0.17"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos", target_os = "windows"))'.dependencies]
notify-rust = { version = "4", default-features = false, features = ["z"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "signal", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }

# Único crate com `unsafe` permitido (FFI de SO: PDEATHSIG, Job Object); o resto
# do workspace mantém `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "allow"
[lints.clippy]
all = "warn"
