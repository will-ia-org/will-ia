name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", "packaging/**"]
  pull_request:
    paths-ignore: ["docs/**", "*.md", "packaging/**"]

# Um push novo cancela o run anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0

jobs:
  lint-test:
    name: fmt + clippy + test (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Dependências de sistema (ALSA para o cpal)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Smoke headless (fake-claude)
        run: |
          cargo build -p will-ia -p will-app -p fake-claude
          scripts/smoke.sh

  check:
    # Só checagem de tipos/compilação (sem link, sem LTO): pega os erros
    # específicos de cada SO em poucos minutos. O build completo é do release.yml.
    name: check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
          - name: macos-aarch64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p will-ia -p will-app -p will-setup --all-targets
