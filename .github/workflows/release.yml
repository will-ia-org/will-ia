name: Release

# Dispara em tags `v*` (ex.: v0.1.5) ou manualmente. Compila, em paralelo, Linux x86_64,
# Windows x86_64, macOS x86_64 e macOS aarch64 e publica UM pacote por SO (e por
# arquitetura no macOS) numa GitHub Release. Layout decidido em 2026-10-29 (docs/13):
#
#   will-ia-<v>-macos-aarch64.zip     "Instalar will-ia.app" (instalador) + will-ia.app (app + servidor)
#   will-ia-<v>-macos-x86_64.zip        + README.md, LICENSE, docs/
#   will-ia-<v>-windows-x86_64.zip    will-ia-setup.exe, will-ia.exe, will-ia-app.exe + README.md, LICENSE, docs/
#   will-ia-<v>-linux-x86_64.tar.gz   will-ia-setup, will-ia, will-ia-app + README.md, LICENSE, docs/,
#                                       packaging/linux/, packaging/systemd/
#   will-ia_<v>-1_amd64.deb           cargo-deb (crates/will-ia/Cargo.toml): os três binários em /usr/bin,
#                                       .desktop do app e user unit do servidor
#   SHA256SUMS.txt                    de todos os acima
#
# Cada pacote descompacta numa pasta `will-ia-<v>-<plataforma>/`; o usuário abre o instalador
# (`will-ia-setup`, docs/27) ou usa os binários soltos à mão.
#
# Três binários por plataforma (ADR-0019 + ADR-0021):
#   will-ia        servidor residente (+ bandeja quando há desktop; `serve` = headless)
#   will-ia-app    app desktop (egui), cliente do servidor
#   will-ia-setup  instalador/atualizador por usuário, com os dois acima EMBUTIDOS
#                  (WILL_SETUP_PAYLOAD_DIR no build) — por isso ele é compilado DEPOIS dos outros.
#
# Não publicamos mais: pacote portátil (`packaging/portable/` continua no repo, montado à mão),
# `.app.zip` separados, binários soltos por plataforma.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: 0.1.5). Vazio = usa a versão do Cargo.toml"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # nome do produto (prefixo dos pacotes)
  NAME: will-ia
  # binários do payload (servidor + app), compilados primeiro e embutidos no instalador
  BINS: will-ia will-ia-app
  # instalador
  SETUP: will-ia-setup

jobs:
  version:
    name: versão
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            v="${{ github.event.inputs.version }}"
          else
            v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "versão: $v"

  build:
    name: build (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04          # glibc mais antiga = binário roda em mais distros
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - name: macos-x86_64
            os: macos-latest           # compilação cruzada para Intel no runner Apple Silicon
            target: x86_64-apple-darwin
            ext: ""
          - name: macos-aarch64
            os: macos-latest           # runner Apple Silicon
            target: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      - name: Compilar (servidor + app)
        run: cargo build --release -p will-ia -p will-app --target ${{ matrix.target }}

      - name: Compilar instalador (com os dois binários embutidos)
        shell: bash
        env:
          # caminho ABSOLUTO: o build.rs roda com cwd = crates/will-setup
          WILL_SETUP_PAYLOAD_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
        run: cargo build --release -p will-setup --target ${{ matrix.target }}

      # Um pacote por plataforma. A pasta de staging `dist/<name>/` vira o conteúdo do
      # arquivo (o usuário descompacta e já vê a pasta com o instalador dentro).
      - name: Empacotar (um pacote por plataforma)
        shell: bash
        run: |
          set -euo pipefail
          rel="target/${{ matrix.target }}/release"
          ext="${{ matrix.ext }}"
          name="${NAME}-${VERSION}-${{ matrix.name }}"
          out=dist; stage="$out/$name"
          rm -rf "$stage"; mkdir -p "$stage"

          # comum a todos: README, licença e documentação
          cp README.md LICENSE "$stage/"
          cp -r docs "$stage/docs"

          case "${{ runner.os }}" in
            macOS)
              # will-ia.app: executável principal = o app; o servidor fica ao lado em Contents/MacOS/
              # (o app o encontra e o servidor acha o app na mesma pasta ao lançá-lo pela bandeja)
              app="$stage/${NAME}.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp "$rel/will-ia-app" "$app/Contents/MacOS/will-ia-app"
              cp "$rel/will-ia"     "$app/Contents/MacOS/will-ia"
              sed "s/__VERSION__/${VERSION}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
              # "Instalar will-ia.app": duplo clique abre o assistente (payload dentro do binário)
              setup="$stage/Instalar will-ia.app"
              mkdir -p "$setup/Contents/MacOS" "$setup/Contents/Resources"
              cp "$rel/${SETUP}" "$setup/Contents/MacOS/${SETUP}"
              sed "s/__VERSION__/${VERSION}/g" packaging/macos/Setup-Info.plist > "$setup/Contents/Info.plist"
              chmod +x "$app/Contents/MacOS/"* "$setup/Contents/MacOS/"*
              # não assinado/notarizado: o usuário remove a quarentena (xattr -dr com.apple.quarantine)
              # ou libera em Privacidade e Segurança › "Abrir Mesmo Assim" (docs/13).
              # `zip -y` preserva symlinks e os bits de execução; a pasta de staging vira a raiz do zip.
              (cd "$out" && zip -qr -y "${name}.zip" "$name")
              ;;
            Windows)
              for b in $SETUP $BINS; do cp "$rel/${b}${ext}" "$stage/"; done
              (cd "$out" && 7z a -tzip "${name}.zip" "$name" >/dev/null)
              ;;
            Linux)
              for b in $SETUP $BINS; do cp "$rel/${b}${ext}" "$stage/"; chmod +x "$stage/${b}${ext}"; done
              # .desktop do app e user unit do servidor, para instalação manual/de sistema
              mkdir -p "$stage/packaging"
              cp -r packaging/linux packaging/systemd "$stage/packaging/"
              tar -czf "$out/${name}.tar.gz" -C "$out" "$name"
              ;;
          esac

          rm -rf "$stage"
          ls -la "$out"

      - name: .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          # assets do .deb (will-ia, will-ia-app, will-ia-setup, .desktop, user unit) em crates/will-ia/Cargo.toml;
          # com --target o cargo-deb reescreve target/release/ → target/<triple>/release/
          cargo deb -p will-ia --no-build --target ${{ matrix.target }} -o dist/
          ls -la dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: juntar + SHA256 + publicar
    needs: [version, build]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Juntar artefatos e gerar SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # um diretório por job de build → tudo num diretório plano
          find artifacts -type f -exec cp {} release/ \;
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -la release
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/*
      - name: Publicar GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: will-ia v${{ env.VERSION }}
          generate_release_notes: true
          files: release/*
          body: |
            ## Pacotes

            Um pacote por sistema (e por arquitetura no macOS). Cada um traz o **instalador `will-ia-setup`**,
            o **servidor `will-ia`** e o **app `will-ia-app`**, mais `README.md`, `LICENSE` e `docs/`.

            | Arquivo | Para quem | Conteúdo |
            |---|---|---|
            | `will-ia-${{ env.VERSION }}-macos-aarch64.zip` | Mac com Apple Silicon (M1/M2/M3/M4) | `Instalar will-ia.app` (instalador) + `will-ia.app` (app + servidor) |
            | `will-ia-${{ env.VERSION }}-macos-x86_64.zip` | Mac com Intel | idem |
            | `will-ia-${{ env.VERSION }}-windows-x86_64.zip` | Windows 10/11 64 bits | `will-ia-setup.exe`, `will-ia.exe`, `will-ia-app.exe` |
            | `will-ia-${{ env.VERSION }}-linux-x86_64.tar.gz` | Linux x86_64 (qualquer distro) | `will-ia-setup`, `will-ia`, `will-ia-app` + `packaging/linux/`, `packaging/systemd/` |
            | `will-ia_${{ env.VERSION }}-1_amd64.deb` | Debian/Ubuntu e derivados | instala os três binários em `/usr/bin`, o `.desktop` do app e a user unit do servidor |
            | `SHA256SUMS.txt` | conferência | `sha256sum -c SHA256SUMS.txt --ignore-missing` |

            ## Como instalar

            1. Baixe o pacote do seu sistema e **descompacte**.
            2. **Abra o instalador** (`Instalar will-ia.app` no macOS, `will-ia-setup.exe` no Windows, `./will-ia-setup` no Linux). Ele instala/atualiza por usuário, registra o servidor para subir no login, cria os atalhos e **preserva os seus dados** (`docs/27`).
            3. Detalhes por sistema:
               - **macOS** (não notarizado): se aparecer "Apple não conseguiu verificar…", libere em *Ajustes do Sistema › Privacidade e Segurança › Abrir Mesmo Assim* ou rode `xattr -dr com.apple.quarantine "Instalar will-ia.app" will-ia.app`.
               - **Windows**: no SmartScreen clique em *Mais informações › Executar assim mesmo*.
               - **Linux sem tela** (servidor): `./will-ia-setup --yes` (modo texto automático; `--status` só mostra o que foi detectado).
               - **Debian/Ubuntu** (instalação de sistema): `sudo apt install ./will-ia_${{ env.VERSION }}-1_amd64.deb` e depois `systemctl --user enable --now will-ia` (ou abra o app pelo menu).

            Os binários soltos (`will-ia`, `will-ia-app`) continuam dentro do pacote para quem prefere instalar à mão
            ou montar o modo portátil (`packaging/portable/`, `docs/13`).
